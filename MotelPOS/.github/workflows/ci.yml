name: iOS CI

on:
  push:
    branches: [ main, work ]
  pull_request:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v3
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.1.app
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project MotelPOS.xcodeproj
      - name: Run tests
        run: xcodebuild test -project MotelPOS.xcodeproj -scheme MotelPOS -destination 'platform=iOS Simulator,name=iPad (10th generation)'
